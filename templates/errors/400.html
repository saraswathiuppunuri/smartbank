{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-warning fw-bold mb-3">400</div>
        <h3 class="fw-bold text-dark mb-2">Invalid Request</h3>
        <p class="text-muted mb-4">The banking server could not understand or process your request due to invalid parameters.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
