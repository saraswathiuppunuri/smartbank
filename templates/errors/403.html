{% extends "base.html" %}

{% block title %}403 - Forbidden Access{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-shield-x"></i></div>
        <h3 class="fw-bold text-dark mb-2">Access Denied</h3>
        <p class="text-muted mb-4">You do not possess the necessary clearance or role permissions to access this banking resource.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
