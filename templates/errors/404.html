{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-primary fw-bold mb-3">404</div>
        <h3 class="fw-bold text-dark mb-2">Resource Not Found</h3>
        <p class="text-muted mb-4">The banking page or transaction record you are seeking does not exist or has been relocated.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
